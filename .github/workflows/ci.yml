name: Next.js Frontend CI

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile=false

    - name: TypeScript Typecheck
      run: npx tsc --noEmit

    - name: Build Next.js Application
      run: pnpm run build

    - name: Trigger Vercel Deploy Hook
      if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'push'
      env:
        DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      run: |
        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering Vercel deployment..."
          curl -s -X POST "$DEPLOY_HOOK"
        else
          echo "VERCEL_DEPLOY_HOOK secret is not set, skipping deployment."
        fi

